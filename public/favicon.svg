<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Petty Shine">
  <!--
    Petty Shine mark, the arc pair off his own shop banner: a heavy cyan
    swoosh with a thinner silver swoosh nested inside it, on black. The
    wordmark is deliberately left out, it is illegible at 16px. Each arc is
    the region between two ellipses, which is what gives the sweep its taper
    to a point at both tips.
  -->
  <rect width="64" height="64" fill="#0A0B09"/>
  <g transform="rotate(-15 32 32)">
    <path fill="#00C1F3" d="M55.39 17.36 A30.0 22.0 0 1 0 55.39 46.64 A26.0 18.5 0 1 1 55.39 17.36 Z"/>
    <path fill="#9BA7AE" d="M59.24 20.9 A23.0 16.0 0 1 0 59.24 43.1 A21.8 15.0 0 1 1 59.24 20.9 Z"/>
  </g>
</svg>
