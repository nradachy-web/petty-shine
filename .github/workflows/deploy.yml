name: Deploy to GitHub Pages

# Two modes, both driven by repository variables so no code change is needed
# to flip between them:
#
#   PREVIEW:       NEXT_PUBLIC_BASE_PATH = /petty-shine
#                   CUSTOM_DOMAIN         = (unset)
#                   -> https://nradachy-web.github.io/petty-shine/, noindex
#
#   PRODUCTION:     NEXT_PUBLIC_BASE_PATH = (unset or empty)
#                   CUSTOM_DOMAIN         = www.pettyshine.com
#                   -> served at the domain root, indexable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate publishing configuration
        env:
          BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          FORM_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          FORM_TOKEN: ${{ vars.NEXT_PUBLIC_APEX_FORM_TOKEN }}
        run: |
          if [ -n "$BASE_PATH" ]; then
            test -z "$CUSTOM_DOMAIN" || { echo "Preview must not use a custom domain"; exit 1; }
            test -z "$FORM_TOKEN" || { echo "Preview must not send production lead attribution"; exit 1; }
          else
            test "$CUSTOM_DOMAIN" = "www.pettyshine.com" || { echo "Production requires the canonical domain"; exit 1; }
            test -n "$FORM_KEY" && test "$FORM_KEY" != "REPLACE_WITH_WEB3FORMS_KEY" || { echo "Production requires a configured quote form"; exit 1; }
            test -n "$FORM_TOKEN" || { echo "Production requires the portal lead token"; exit 1; }
          fi

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          NEXT_PUBLIC_APEX_FORM_TOKEN: ${{ vars.NEXT_PUBLIC_APEX_FORM_TOKEN }}

      - name: Write CNAME (production only)
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
